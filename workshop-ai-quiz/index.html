<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI & Robotics Discovery Quest | iGrow × DXD NextGen</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#1c4065,transparent 40%),linear-gradient(130deg,#071328,#091b31);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f2f7ff;min-height:100vh}.wrap{max-width:750px;margin:auto;padding:28px 17px}.brand{font-size:12px;letter-spacing:1.8px;color:#66e3c2;font-weight:800}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{border:1px solid #446886;border-radius:50px;padding:8px 13px;color:#b6d3e5;font-size:12px}.panel{margin-top:22px;padding:26px;background:linear-gradient(145deg,#142c49,#11213d);border:1px solid #315573;border-radius:23px;box-shadow:0 20px 60px #0005}.hero{font-size:clamp(32px,5vw,53px);line-height:1.08;margin:15px 0}.sub{color:#b5cbdc;line-height:1.6}.robot{font-size:77px;text-align:center;padding:16px;background:#223d5f;border:1px solid #37638c;border-radius:22px;margin:18px 0}input{width:100%;padding:16px;border-radius:13px;border:1px solid #506c87;background:#071932;color:white;font-size:18px}.btn{border:0;background:linear-gradient(100deg,#38ebbf,#65b9ff);padding:16px 20px;color:#06162b;font-weight:900;font-size:16px;border-radius:13px;cursor:pointer;width:100%;margin-top:18px}.btn:disabled{opacity:.5;cursor:not-allowed}.option{display:block;width:100%;padding:15px;text-align:left;color:#ecf6ff;background:#1a3553;border:1px solid #41627e;border-radius:13px;margin:11px 0;cursor:pointer;font-size:16px}.option:hover{border-color:#52d6ee}.option.selected{background:#195d70;border-color:#4ce3c1}.option.good{background:#165b42;border-color:#40e9a2}.option.bad{background:#683440;border-color:#fa8996}.bar{height:9px;background:#253e56;border-radius:15px;overflow:hidden;margin:19px 0}.fill{height:100%;background:linear-gradient(90deg,#32e6b9,#58b9ff);transition:width .3s}.small{color:#a8c5db;font-size:13px}.msg{background:#132e45;padding:14px;border-radius:13px;line-height:1.55;margin-top:14px;border:1px solid #355977}.score{font-size:60px;text-align:center;font-weight:900;color:#48e5c7}.center{text-align:center}.footer{color:#7597b2;font-size:12px;text-align:center;margin:20px}.hidden{display:none}@media print{body{background:white;color:black}.no-print{display:none}.panel{box-shadow:none;border:2px solid #333;color:black;background:white}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">iGROW × DXD NEXTGEN</div><div class="pill">AI + ROBOTICS · 22 NOV 2026</div></div><main class="panel" id="main"></main><div class="footer">Learning through curiosity · Ages 8–16 · No login required</div></div><script>
const qs=[["Which of these is an example of AI?","🤖",["A chatbot answering questions","A plain wooden chair","A paper notebook","A glass of water"],0,"AI software can interpret prompts and generate responses."],["What does AI stand for?","🧠",["Automatic Internet","Artificial Intelligence","Advanced Illustration","Active Instructions"],1,"AI means Artificial Intelligence."],["Which device helps a robot notice an obstacle?","📡",["Speaker","Wheel","Distance sensor","Battery"],2,"A distance sensor measures how far away objects are."],["A robot needs to move forward. Which part helps it move?","⚙️",["Motor","Camera","Microphone","Screen"],0,"A motor turns wheels or other moving parts."],["What is a computer program?","💻",["A type of metal","A set of instructions","A robot costume","A battery charger"],1,"Programs tell computers what actions to perform."],["Which is the safest action when an AI asks for your home address?","🛡️",["Share it immediately","Post it publicly","Ask a trusted adult","Guess another address"],2,"Personal details should be protected."],["What is a robot?","🦾",["A machine that senses or acts using instructions","Every toy with batteries","Only a human-shaped machine","Any mobile phone"],0,"Robots are programmable machines that perform physical actions."],["Which task is commonly done with computer vision?","👁️",["Recognizing objects in a picture","Charging a battery","Turning a screw by hand","Printing a blank page"],0,"Computer vision analyzes images or video."],["What gives a mobile robot electrical energy?","🔋",["Plastic","Battery","Paint","Sticker"],1,"Batteries store energy used by many mobile robots."],["What is an algorithm?","🧩",["A robot's name","A random guess","A sequence of steps","A kind of sensor"],2,"An algorithm is a defined process for solving a problem."],["A robot faces north. It turns right. Which direction now?","🧭",["West","South","North","East"],3,"Right of north is east."],["Which example best describes generative AI?","✨",["A tool creating a new story from a prompt","A manual pencil sharpener","A switched-off fan","A plain cardboard box"],0,"Generative AI can produce new text, images and other content."],["A line-following robot needs to notice a dark line. Which part helps?","🏁",["Light/reflectance sensor","Loudspeaker","Propeller","Keyboard"],0,"An optical reflectance sensor can detect contrast between a line and the floor."],["What should you do if an AI answer sounds surprising?","🔎",["Believe it automatically","Check reliable sources","Share without reading","Ignore all teachers"],1,"AI can make mistakes, so verification matters."],["Which of these is an input to a robot?","🎤",["Sensor reading","Motor rotation","Wheel movement","Robot arm lifting"],0,"Sensors provide information as input."],["Which of these is an output from a robot?","🚗",["Temperature measurement","Camera image","Motor spinning","Distance measurement"],2,"A motor's movement is an output action."],["If a robot repeats 'forward 1 step' three times, how far does it go?","🔁",["1 step","2 steps","3 steps","4 steps"],2,"One step repeated three times makes three steps."],["Which material is best for an early robot prototype?","🧱",["Cardboard and reusable parts","Dangerous chemicals","Broken glass","Unprotected sharp blades"],0,"Safe, low-cost materials are ideal for first designs."],["Which is a good way to use AI in learning?","📚",["Copy every answer without thinking","Ask for explanations and check understanding","Share friends' passwords","Skip practicing"],1,"AI can assist learning when you still think and practice."],["What does a microphone sense?","🎵",["Light","Heat only","Sound","Wheel speed only"],2,"Microphones detect sound waves."],["A robot should stop before hitting a wall. What is the best logic?","🚦",["If wall is near, stop","Always accelerate","Ignore sensor values","Turn off every sensor"],0,"A simple conditional can prevent a collision."],["Which idea could help your local community?","🌍",["A robot that sorts recyclable waste","A robot that damages trees","An app that leaks private information","A machine that wastes water"],0,"Technology is most useful when it solves real problems responsibly."]];let idx=0,score=0,selected=null,name='',answers=[];
const el=document.getElementById('main'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function start(){el.innerHTML='<div class="center"><div class="robot">🤖🚀</div><div class="brand">DISCOVERY QUEST</div><h1 class="hero">Are you a future inventor?</h1><p class="sub">Explore 22 picture-powered AI and robotics challenges. Earn 10 points for each correct answer and receive your Explorer Certificate!</p></div><label class="small" for="name">Your first name or nickname</label><input id="name" maxlength="35" placeholder="Enter your first name"><button class="btn" id="go">Start my quest →</button><p class="small center">Play alone or with your teacher. No account needed.</p>';document.getElementById('go').onclick=()=>{name=document.getElementById('name').value.trim()||'Explorer';idx=0;score=0;answers=[];show()}}
function show(){selected=null;let q=qs[idx];el.innerHTML='<div class="top"><strong>Question '+(idx+1)+' of '+qs.length+'</strong><span class="pill">⭐ '+score+' pts</span></div><div class="bar"><div class="fill" style="width:'+((idx)/qs.length*100)+'%"></div></div><div class="robot">'+q[1]+'</div><h2>'+esc(q[0])+'</h2><div id="options"></div><div id="feedback"></div><button class="btn" id="next" disabled>Choose an answer</button>';q[2].forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>choose(i);document.getElementById('options').appendChild(b)});document.getElementById('next').onclick=()=>{idx++;if(idx===qs.length)finish();else show()}}
function choose(i){if(selected!==null)return;selected=i;let q=qs[idx],good=i===q[3];if(good)score+=10;answers.push(good);document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===q[3])b.classList.add('good');else if(j===i)b.classList.add('bad')});document.getElementById('feedback').innerHTML='<div class="msg">'+(good?'🎉 Excellent! ':'💡 Keep exploring! ')+esc(q[4])+'</div>';let next=document.getElementById('next');next.disabled=false;next.textContent=idx===qs.length-1?'See my results 🏆':'Next challenge →'}
function finish(){const pct=Math.round(score/(qs.length*10)*100),title=pct>=85?'Future AI Inventor':pct>=60?'Robotics Explorer':'Curious Creator';el.innerHTML='<div class="center"><div class="robot">🏆🤖✨</div><div class="brand">QUEST COMPLETED</div><h1>Well done, '+esc(name)+'!</h1><div class="score">'+score+' / '+(qs.length*10)+'</div><p class="sub">You answered '+answers.filter(Boolean).length+' of '+qs.length+' questions correctly.</p><h2>'+title+'</h2><p class="sub">Curiosity is your superpower. Keep asking questions, building and experimenting!</p><div class="msg"><strong>iGrow × DXD NextGen Explorer Certificate</strong><p>Awarded to '+esc(name)+' for completing the AI & Robotics Discovery Quest on 22 November 2026.</p></div></div><button class="btn no-print" onclick="window.print()">🖨️ Print my certificate</button><button class="btn no-print" onclick="start()">🔄 Play again</button>'}
start();
</script></body></html>
