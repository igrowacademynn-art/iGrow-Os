name: iGrow operations checks
on:
  pull_request:
  push:
    branches: [feature/remote-operations-v1]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm test
