name: Remote operations verification
on:
  push:
    branches:
      - feature/remote-operations-v1
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run existing unit tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
